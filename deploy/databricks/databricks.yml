bundle:
  name: landcover-seg-unet

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog name for persistent volumes and model registration"
    default: "main"
  schema:
    description: "Unity Catalog schema name"
    default: "landcover"
  volume:
    description: "Unity Catalog volume name"
    default: "experiments"
  node_type_id:
    description: "Databricks GPU compute worker node type (AWS: g4dn.xlarge, Azure: Standard_NC4as_T4_v3)"
    default: "g4dn.xlarge"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: landcover_dev
      volume: experiments_dev
      node_type_id: g4dn.xlarge

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_catalog
      schema: landcover_prod
      volume: experiments_prod
      node_type_id: g4dn.xlarge
