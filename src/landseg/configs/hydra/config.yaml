# Main entry to the config tree
defaults:
  - _self_
  # data ETL
  - data: default
  # models
  - models: default
  # session
  - session: default
  # study
  - study: default
  # command
  - command: default
  # disable logging entirely
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

# execution options
execution:
  verbosity: select # 'full', 'select', 'silent'
  exp_root: ./experiment
  user_cfg: ${oc.env:AUX_SETTINGS_PATH, null} # user supply
  dev_cfg: ${oc.env:AUX_SETTINGS_PATH, null} # dev only

# hydra settings
hydra:
  run:
    dir: .
  output_subdir: null