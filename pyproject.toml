[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landseg"
version = "0.2.1"
description = "Multi-Modal Landcover Classification Framework"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "mlflow>=2.13",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "optuna>=4.0,<5.0",
    "pandas>=2.2",
    "pillow>=10",
    "protobuf>=6.0.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "sentence-transformers>=3.0",
    "tensorboard>=2.16",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.scripts]
landseg = "landseg.adapters.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1"
]
dev = [
    "landseg[test]",
    "pylint>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["landseg*"]

[tool.setuptools.package-data]
landseg = ["configs/**/*.yaml", "configs/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:rasterio.*",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.coverage.run]
source = ["landseg"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if typing.TYPE_CHECKING:",
    "@typing.overload",
    "raise NotImplementedError",
]