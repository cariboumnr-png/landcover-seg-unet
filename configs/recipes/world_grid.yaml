# =============================================================================
# World Grid Generation Recipe
# -----------------------------------------------------------------------------
# Constructs and persists canonical spatial tiling grid for the
# experiment.
# =============================================================================

# -----------------------------------------------------------------------------
# Pipeline I/O Paths
# -----------------------------------------------------------------------------
# Destination directory for generated world grid artifacts
output_dpath: ./experiment/artifacts/world_grids

# -----------------------------------------------------------------------------
# Spatial Target & World Grid Tiling
# -----------------------------------------------------------------------------
# Reference GeoTIFF defining geographic extent and projection
extent_reference_raster: ./experiment/input/reference_raster/sample_extent.tif

# Spatial tile dimensions and stride (pixels)
tile_size: [256, 256]
tile_stride: [128, 128]