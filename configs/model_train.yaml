# =============================================================================
# Model Training Recipe
# -----------------------------------------------------------------------------
# Configures neural network model architecture, hyperparameters, and
# training session execution.
# =============================================================================

data:
  # ---------------------------------------------------------------------------
  # Upstream Pipeline I/O
  # ---------------------------------------------------------------------------
  preparation:
    # Upstream prepared data directory
    output_dpath: ./experiment/artifacts/prepared_data

# -----------------------------------------------------------------------------
# Model Architecture & Hyperparameters
# -----------------------------------------------------------------------------
models:
  # Model body name (choices: "unet", "unetpp", "unetppp")
  model_body: unetppp

  # Bottleneck type (choices: "conv", "transformer", "hybrid")
  bottleneck: transformer

  # Conditioning/fusion methods (choices: list of [concat, film])
  conditioners: [concat, film]

# -----------------------------------------------------------------------------
# Training Session Execution
# -----------------------------------------------------------------------------
session:
  # Destination directory for training results and session artifacts
  output_dpath: ./experiment/results

  dataloader:
    # Pixel patch size for loader (must divide tile_size)
    patch_size: 128

    # Number of samples per training batch
    batch_size: 16

  orchestration:
    curriculum:
      single:
        phases:
          - name: demo-train
            num_epochs: 10
            active_heads: null