# =============================================================================
# World Grid Generation Recipe
# -----------------------------------------------------------------------------
# Constructs and persists canonical spatial tiling grid for the
# experiment.
# =============================================================================

data:
  world_grid:
    # -------------------------------------------------------------------------
    # Spatial tile dimensions and stride (pixels)
    # -------------------------------------------------------------------------
    tile_size: [256, 256]
    tile_stride: [128, 128]

    # -------------------------------------------------------------------------
    # Spatial Target & World Grid Tiling
    # -------------------------------------------------------------------------
    mode: ref
    ref_fpath: ./experiment/input/reference_raster/sample_extent.tif

    # -------------------------------------------------------------------------
    # Pipeline I/O Paths
    # -------------------------------------------------------------------------
    output_dpath: ./experiment/artifacts/world_grids